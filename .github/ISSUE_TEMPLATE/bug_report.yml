name: 问题反馈
description: 报告错误或异常行为
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: FileAtlas 版本和 Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用脱敏路径与样例文件，说明操作顺序。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 不要上传凭据、私人文件或完整 Claude 配置。
